<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3Dカードコレクター</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        header {
            padding: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.25rem;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px;
        }

        /* ナビゲーションバー */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        nav button {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        nav button.active {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }

        /* ボタン共通 */
        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        /* 3Dカードスタイル */
        .card-container {
            perspective: 1000px;
            width: 260px;
            height: 380px;
            margin: 20px auto;
            cursor: grab;
            touch-action: none;
        }
        .card-container:active { cursor: grabbing; }

        .card-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .card-back {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            align-items: center;
            justify-content: center;
            border: 3px solid #38bdf8;
        }

        /* レア度別デザイン */
        .rarity-N { background: linear-gradient(135deg, #64748b, #475569); border-color: #94a3b8; }
        .rarity-R { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; }
        .rarity-SR { background: linear-gradient(135deg, #7c3aed, #5b21b6); border-color: #c084fc; box-shadow: 0 0 20px rgba(192, 132, 252, 0.4); }
        .rarity-UR { background: linear-gradient(135deg, #b45309, #d97706); border-color: #fcd34d; box-shadow: 0 0 25px rgba(252, 211, 77, 0.6); }
        .rarity-LR { 
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6, #10b981);
            background-size: 300% 300%;
            animation: rainbowBG 6s ease infinite;
            border-color: #fff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
        }
        @keyframes rainbowBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-body {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-power {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* 開封画面演出 */
        #gacha-screen, #collection-screen, #detail-modal {
            display: none;
            width: 100%;
            height: 100%;
        }
        .active-view { display: flex !important; }

        /* コレクション一覧グリッド */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            padding: 4px;
        }

        .mini-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .mini-card:active { transform: scale(0.96); }
        .mini-card.rarity-LR { border-color: #f43f5e; }

        /* モーダル */
        #detail-modal {
            position: fixed;
            top: 0; left: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* 花火Canvas */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 250;
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>3D Card Collection</h1>
    </header>

    <!-- ガチャ / パック開封画面 -->
    <div id="gacha-screen" class="main-content active-view">
        <div id="gacha-home" style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 20px;">📦</div>
            <h2 style="margin-bottom: 10px;">プレミアムパック</h2>
            <p style="color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem;">5枚1セットでカードを獲得！<br>最高レアLRには花火演出付き！</p>
            <button class="btn" onclick="openPack()">パックを開封する</button>
        </div>

        <div id="gacha-opening" style="display: none; text-align: center; width: 100%;">
            <p id="pack-counter" style="margin-bottom: 10px; color: #38bdf8; font-weight: bold;"></p>
            <div class="card-container" id="opening-card-container">
                <div class="card-3d" id="opening-card">
                    <!-- 動的生成 -->
                </div>
            </div>
            <button class="btn" id="next-card-btn" style="margin-top: 20px;" onclick="nextCard()">次のカードへ</button>
        </div>
    </div>

    <!-- コレクション画面 -->
    <div id="collection-screen" class="main-content">
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 id="collection-count">所持カード: 0枚</h3>
        </div>
        <div class="collection-grid" id="collection-grid">
            <!-- 動的生成 -->
        </div>
    </div>

    <!-- 3D詳細ビューモーダル -->
    <div id="detail-modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <p style="color: #94a3b8; margin-bottom: 10px; font-size: 0.85rem;">👆 指でグリグリ動かして360度チェック</p>
        <div class="card-container" id="modal-card-container">
            <div class="card-3d" id="modal-card">
                <!-- 動的生成 -->
            </div>
        </div>
    </div>

    <!-- ナビゲーション -->
    <nav>
        <button id="nav-gacha" class="active" onclick="switchTab('gacha')">パック開封</button>
        <button id="nav-collection" onclick="switchTab('collection')">コレクション</button>
    </nav>
</div>

<canvas id="particle-canvas"></canvas>

<script>
    // ==========================================
    // 100種類のカード生成エンジン配列
    // ==========================================
    const adjList = [

        "爆誕した", "真空の", "超音速の", "電光石火の", "昼寝中の", "よれよれの", "ぴちぴちの", "孤高の",
        "誇り高き", "腹ペコの", "満腹の", "暴走する", "優雅な", "どん底の", "天使の", "悪魔の",
        "メタバースの", "レトロな", "近未来の", "バグった", "聖なる", "呪われた", "無敵の", "豆腐メンタルな",
        "剛健な", "シャイな", "饒舌な", "沈黙の", "疾風怒濤の", "虚無の", "混沌の", "秩序ある",
        "猫なで声の", "猛獣の", "慈悲深い", "冷酷無比な", "永遠の", "一瞬の", "瞬速の", "ぬるま湯の",
        "熱湯コールの", "凍てつく", "灼熱の", "芳醇な", "渋い", "甘口の", "激辛の", "クセ強の",
        "エモい", "バズり中の", "炎上中の", "職人技の", "素人感あふれる", "プロ級の", "迷走中の", "直感的な",
        "AI搭載の", "手作りの", "工場直売の", "プレミアムな", "訳ありの", "デラックスな", "エコな", "サステナブルな",
        "幻覚の", "リアルな", "2次元の", "3次元の", "4次元の", "パラレルな", "異世界の", "転生した",
        "勇者風の", "魔王風の", "村人Aの", "主役級の", "モブの", "センターの", "凡人の", "天才の",
        "奇跡の", "運命の", "宿命の", "自由な"
    ]; // 計100個

    const nounList = [
        "メモリー", "スナップ", "ワンダー", "モーメント", "フォトン", "ブレイク", "ガーディアン", "ドリーム",
        "ナイトメア", "パラドックス", "エピローグ", "プロローグ", "シンフォニー", "メロディ", "リズム", "カオス",
        "コスモス", "ネビュラ", "ブラックホール", "スーパーノヴァ", "メテオ", "コメット", "サテライト", "ゲパルト",
        "ドラゴン", "フェニックス", "グリフォン", "キマイラ", "スフィンクス", "クラーケン", "ユニコーン", "ペガサス",
        "ゴーレム", "スライム", "ゾンビ", "ヴァンパイア", "ウルフ", "キャット", "ドッグ", "バード",
        "フィッシュ", "プラント", "マシーン", "サイボーグ", "アンドロイド", "ロボット", "AI", "サーバー",
        "ルーター", "ファイアウォール", "バグ", "パッチ", "アップデート", "ダウンロード", "クラウド", "ストリーム",
        "バッファ", "キャッシュ", "クッキー", "セッション", "トークン", "ブロックチェーン", "暗号", "鍵",
        "宝箱", "剣", "盾", "杖", "槍", "弓", "銃", "鎧",
        "兜", "冠", "指輪", "薬", "魔法", "呪文", "祈り", "誓い",
        "契約", "魂", "心", "思考", "感情", "涙", "笑顔", "怒り",
        "絶叫", "歌声", "足音", "影", "光", "風", "水", "火",
        "土", "雷", "氷", "闇"
    ]; // 計100個

    const attackList = [
        "思い出ビーム", "シャッターラッシュ", "エモい衝撃", "フラッシュ記憶", "無限メモリー", "超光速スナップ",
        "爆裂スマッシュ", "絶叫デシベル", "永遠のタイムライン", "バグ修正キック", "404エラーパンチ", "無限ローディング",
        "キャッシュクリアスラッシュ", "伝説の寝落ち", "限界突破プレス", "電源ボタンアタック", "強制終了クラッシュ", "サクサク動作ラッシュ",
        "重いデータスロー", "クラウド同期バースト", "リアルタイム同期", "オフラインモード", "Wi-Fi切断ショック", "ギガ不足プレッシャー",
        "課金チャージスラッシュ", "ガチャ天井ブラスト", "すり抜け地獄", "虹色確定フラッシュ", "爆死の予感", "神引きビーム",
        "一撃入魂パンチ", "百烈メモリー", "千本ノック", "万全の体調", "五月雨チョップ", "三日月スラッシュ",
        "満月ビーム", "新月ダークネス", "太陽フレア", "月面着陸", "銀河系キック", "ブラックホール吸い込み",
        "スーパーノヴァ爆発", "流星群アタック", "隕石落下", "彗星の如く", "雷神の鉄槌", "水神の怒り",
        "炎の舞", "氷結地獄", "竜巻旋風脚", "地震雷火事親父", "猫パンチ", "犬の遠吠え",
        "鳥の羽ばたき", "魚の跳ね", "植物の根っこ", "機械のオイル切れ", "ロボット三原則破り", "AIの反逆",
        "サーバーダウン", "メンテナンス突入", "パスワード忘れ", "二段階認証突破", "フィッシング詐欺", "スパムアタック",
        "ウイルス感染", "アンチウイルス", "ファイアウォール突破", "デバッグ完了", "ソースコード解析", "リファクタリング",
        "コンパイルエラー", "構文解析キック", "メモリリーク", "ガベージコレクション", "例外処理", "無限ループ",
        "スタックオーバーフロー", "セグメンテーション違反", "ブルースクリーン", "フリーズアタック", "再起動の呪文", "バックアップ完了",
        "リストアパンチ", "初期化ビーム", "工場出荷時", "アップデート通知", "利用規約同意", "プライバシーポリシー",
        "キャンセル不可", "返品お断り", "返金保証", "プレミアム会員", "VIP待遇", "ログインボーナス",
        "デイリーミッション", "イベント開催中", "メンテナンス延長", "詫び石アタック"
    ]; // 計100個

    // ==========================================
    // アプリの状態管理
    // ==========================================
    let collection = JSON.parse(localStorage.getItem('card_collection') || '[]');
    let currentPack = [];
    let currentCardIndex = 0;

    // ==========================================
    // ガチャ・カード生成ロジック
    // ==========================================
    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateCard() {
        const rand = Math.random() * 100;
        let rarity = 'N';
        let powerMin = 100, powerMax = 500;

        if (rand < 1) {
            rarity = 'LR'; // 1% 最高レア（虹色＆花火）
            powerMin = 9000; powerMax = 9999;
        } else if (rand < 5) {
            rarity = 'UR'; // 4%
            powerMin = 5000; powerMax = 8999;
        } else if (rand < 15) {
            rarity = 'SR'; // 10%
            powerMin = 2000; powerMax = 4999;
        } else if (rand < 40) {
            rarity = 'R';  // 25%
            powerMin = 800;  powerMax = 1999;
        }

        const name = getRandomItem(adjList) + getRandomItem(nounList);
        const attack = getRandomItem(attackList);
        const power = Math.floor(Math.random() * (powerMax - powerMin + 1)) + powerMin;

        return {
            id: 'CARD_' + Math.random().toString(36).substr(2, 9),
            name: name,
            rarity: rarity,
            power: power,
            attack: attack,
            date: new Date().toLocaleDateString()
        };
    }

    function openPack() {
        currentPack = [];
        for (let i = 0; i < 5; i++) {
            currentPack.push(generateCard());
        }
        // コレクションに追加保存
        collection.push(...currentPack);
        localStorage.setItem('card_collection', JSON.stringify(collection));

        currentCardIndex = 0;
        document.getElementById('gacha-home').style.display = 'none';
        document.getElementById('gacha-opening').style.display = 'block';
        showOpeningCard();
    }

    function showOpeningCard() {
        if (currentCardIndex >= currentPack.length) {
            // パック終了 -> コレクション画面へ
            switchTab('collection');
            document.getElementById('gacha-home').style.display = 'block';
            document.getElementById('gacha-opening').style.display = 'none';
            return;
        }

        document.getElementById('pack-counter').innerText = `パック開封中... (${currentCardIndex + 1} / 5)`;
        const card = currentPack[currentCardIndex];
        renderCardHTML('opening-card', card);

        // 最高レア（LR）が出たら花火演出
        if (card.rarity === 'LR') {
            triggerFireworks();
        }
    }

    function nextCard() {
        currentCardIndex++;
        showOpeningCard();
    }

    // ==========================================
    // カードHTML描画テンプレート
    // ==========================================
    function renderCardHTML(elementId, card) {
        const el = document.getElementById(elementId);
        el.className = `card-3d rarity-${card.rarity}`;
        el.style.transform = 'rotateX(0deg) rotateY(0deg)';
        el.innerHTML = `
            <div class="card-face">
                <div class="card-header">
                    <span>${card.rarity} CARD</span>
                    <span>ID: ${card.id.slice(-4)}</span>
                </div>
                <div class="card-body">
                    <div style="font-size: 2.5rem; margin-bottom: 8px;">✨</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-power">必殺技: ${card.attack}</div>
                </div>
                <div class="card-header" style="justify-content: flex-end;">
                    <span>POWER: ${card.power}</span>
                </div>
            </div>
        `;
        init3DRotation(el);
    }

    // ==========================================
    // ①・③ なめらかな3D回転＆慣性エンジン (Pointer Events)
    // ==========================================
    function init3DRotation(cardElement) {
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let velocityX = 0, velocityY = 0;
        let animationFrameId = null;

        const container = cardElement.parentElement;

        function updateTransform() {
            cardElement.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }

        function handlePointerDown(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            cancelAnimationFrame(animationFrameId);
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            velocityX = deltaX * 0.4;
            velocityY = -deltaY * 0.4;

            currentY += velocityX;
            currentX += velocityY;

            // 回転角の制限
            currentX = Math.max(-60, Math.min(60, currentX));

            startX = clientX;
            startY = clientY;

            updateTransform();
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;

            // 慣性アニメーション (Momentum)
            function applyInertia() {
                if (Math.abs(velocityX) < 0.1 && Math.abs(velocityY) < 0.1) return;
                velocityX *= 0.92;
                velocityY *= 0.92;

                currentY += velocityX;
                currentX += velocityY;
                currentX = Math.max(-60, Math.min(60, currentX));

                updateTransform();
                animationFrameId = requestAnimationFrame(applyInertia);
            }
            animationFrameId = requestAnimationFrame(applyInertia);
        }

        container.onpointerdown = handlePointerDown;
        window.onpointermove = handlePointerMove;
        window.onpointerup = handlePointerUp;

        // スマホタッチ対応
        container.ontouchstart = (e) => handlePointerDown(e);
        window.ontouchmove = (e) => handlePointerMove(e);
        window.ontouchend = (e) => handlePointerUp(e);
    }

    // ==========================================
    // コレクション＆モーダル操作
    // ==========================================
    function switchTab(tab) {
        document.getElementById('gacha-screen').classList.remove('active-view');
        document.getElementById('collection-screen').classList.remove('active-view');
        document.getElementById('nav-gacha').classList.remove('active');
        document.getElementById('nav-collection').classList.remove('active');

        if (tab === 'gacha') {
            document.getElementById('gacha-screen').classList.add('active-view');
            document.getElementById('nav-gacha').classList.add('active');
        } else if (tab === 'collection') {
            document.getElementById('collection-screen').classList.add('active-view');
            document.getElementById('nav-collection').classList.add('active');
            renderCollection();
        }
    }

    function renderCollection() {
        const grid = document.getElementById('collection-grid');
        document.getElementById('collection-count').innerText = `所持カード: ${collection.length}枚`;
        grid.innerHTML = '';

        if (collection.length === 0) {
            grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #94a3b8; margin-top: 40px;">まだカードがありません。<br>パックを開封してカードを集めよう！</p>`;
            return;
        }

        // 新しい順に表示
        const reversed = [...collection].reverse();
        reversed.forEach((card, index) => {
            const item = document.createElement('div');
            item.className = `mini-card rarity-${card.rarity}`;
            item.innerHTML = `
                <div style="font-size: 0.75rem; font-weight: bold; width: 100%; display: flex; justify-content: space-between;">
                    <span>${card.rarity}</span>
                    <span>P: ${card.power}</span>
                </div>
                <div style="font-size: 0.95rem; font-weight: bold; margin: 10px 0; text-align: center;">${card.name}</div>
                <div style="font-size: 0.7rem; opacity: 0.8;">${card.attack}</div>
            `;
            item.onclick = () => openCardDetail(card);
            grid.appendChild(item);
        });
    }

    function openCardDetail(card) {
        const modal = document.getElementById('detail-modal');
        modal.classList.add('active-view');
        renderCardHTML('modal-card', card);
        if (card.rarity === 'LR') {
            triggerFireworks();
        }
    }

    function closeModal() {
        document.getElementById('detail-modal').classList.remove('active-view');
    }

    // ==========================================
    // 最高レア(LR)用 花火パーティクルシステム
    // ==========================================
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    function triggerFireworks() {
        particles = [];
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;

        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 2;
            particles.push({
                x: cx,
                y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color: `hsl(${Math.random() * 360}, 100%, 70%)`,
                size: Math.random() * 4 + 2
            });
        }
        animateFireworks();
    }

    function animateFireworks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (particles.length === 0) return;

        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15; // 重力
            p.alpha -= 0.02;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        particles = particles.filter(p => p.alpha > 0);
        if (particles.length > 0) {
            requestAnimationFrame(animateFireworks);
        }
    }
</script>
